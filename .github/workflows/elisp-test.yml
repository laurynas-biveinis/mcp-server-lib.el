name: Emacs Lisp CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        emacs_version:
          - "snapshot"
          - "release-snapshot"
          - "31.1"
          - "30.1"
          - "29.4"
          - "28.2"
        include:
          - os: ubuntu-latest
            emacs_version: "27.2"

    permissions:
      contents: read
      packages: read
      # To report GitHub Actions status checks
      statuses: write
      # To create test report checks
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Emacs
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}

      - name: Set up Eask
        uses: emacs-eask/setup-eask@master
        with:
          version: "snapshot"

      - name: Clean workspace
        run: eask clean all

      - name: Install compatible package-build
        if: matrix.emacs_version == '27.2' || matrix.emacs_version == '28.2'
        run: |
          # package-build 5.1 requires Emacs 29.1; pin 5.0.3 for older jobs.
          mkdir "$RUNNER_TEMP/package-build"
          curl --fail --location --retry 3 \
            https://github.com/melpa/package-build/archive/cb1fc153c79a0f1f7e3d5df1641bbfe39ddba45e.tar.gz \
            --output "$RUNNER_TEMP/package-build.tar.gz"
          tar -xzf "$RUNNER_TEMP/package-build.tar.gz" \
            --strip-components=1 -C "$RUNNER_TEMP/package-build"
          emacs -Q --batch "$RUNNER_TEMP/package-build/package-build.el" \
            --eval "(progn (require 'package)
                      (package-generate-description-file
                       (package-buffer-info)
                       (expand-file-name \"package-build-pkg.el\")))"
          eask install-file "$RUNNER_TEMP/package-build"

      - name: Run tests
        env:
          EMACS_TEST_JUNIT_REPORT: ${{ (matrix.emacs_version != '27.2' && matrix.emacs_version != '28.2') && 'mcp-server-lib-test.xml' || '' }}
        run: |
          eask package
          eask install
          eask compile
          eask lint elisp-lint
          eask lint elisp-lint mcp-server-lib-test.el mcp-server-lib-bytecode-handler-test.el
          eask lint keywords
          eask lint regexps
          eask run script test

      - name: Lint Org files
        if: matrix.os == 'ubuntu-latest' && matrix.emacs_version == '30.1'
        run: eask run script org-lint

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: matrix.emacs_version != '27.2' && matrix.emacs_version != '28.2'
        with:
          name: test-results-${{ matrix.os }}-emacs-${{ matrix.emacs_version }}
          path: mcp-server-lib-test.xml
          retention-days: 7

      - name: Test Report
        uses: dorny/test-reporter@v3 # zizmor: ignore[ref-confusion]
        # Fork PRs cannot create check runs: GitHub withholds `checks: write`
        # from GITHUB_TOKEN on pull_request events from forks, so the
        # test-reporter API call 403s. Skip the step on fork PRs; tests and
        # artifact upload still run. Same-repo PRs, push, and workflow_dispatch
        # keep full reporting.
        if: >-
          matrix.emacs_version != '27.2'
          && matrix.emacs_version != '28.2'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          name: Test Results - ${{ matrix.os }} - Emacs ${{ matrix.emacs_version }}
          path: mcp-server-lib-test.xml
          reporter: java-junit
